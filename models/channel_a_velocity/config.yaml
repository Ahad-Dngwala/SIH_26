# MIP Section 4.2
model:
  input_channels: 6         # accel xyz, gyro xyz
  window_length: 200        # 2s @ 100Hz
  tcn_channels: [32, 64, 64, 128]
  tcn_dilations: [8, 16, 32, 64]   # MIP says [1, 2, 4, 8] - widened (same 8x doubling
                                   # pattern, same kernel/channels/param count) because the
                                   # model reads out only the window's LAST timestep (see
                                   # model.py) and the old dilations gave that position a
                                   # 31-sample (~0.3s) receptive field, far short of the
                                   # 200-sample window. New RF = 241 samples, covers it.
                                   # No latency-budget impact - dilation doesn't add taps
                                   # or params, just spaces the existing 3 out further.
  kernel_size: 3
  dropout: 0.2

loss:
  name: huber
  delta: 1.0

optimizer:
  name: adam
  lr: 1.0e-3
  schedule: reduce_on_plateau
  schedule_factor: 0.5
  schedule_patience: 8

train:
  batch_size: 64
  epochs: 100
  early_stopping_patience: 15
  gradient_clip_max_norm: 5

target:
  metric: velocity_rmse_mps
  threshold: 0.5             # velocity RMSE under 0.5 m/s on held-out routes
