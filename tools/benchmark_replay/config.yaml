# tools/benchmark_replay/config.yaml
#
# MIP Section 9 / docs/HANDOFF_benchmark_replay_tool.md.
#
# ACTUAL COMPONENT STATE (keep this block in sync with `components:` below -
# it previously claimed Channel A/B were "real ✅" while the switches said
# `dummy`, which is how a wrong number ends up on a slide):
#
#   fusion:         real    - fusion_core/python_prototype/ukf.py
#   channel_a:      dummy   - noised ground-truth velocity, NOT a model.
#                             The trained Channel A was rejected at its
#                             acceptance gate (+1.54 m/s bias, see
#                             ../../final_report.md) and never exported to
#                             ONNX, so there is nothing to flip to "real".
#   channel_b:      dummy   - noised ground-truth velocity. Never trained;
#                             its label function does not exist yet.
#   road_signature: dummy   - never returns a confident match.
#   map_matching:   dummy   - identity snap.
#
# The RealVelocityEstimator / RealHmmMapMatcher code paths exist and are
# wired, but no exported model or OSM graph exists in this repo to point
# them at. Setting channel_a/channel_b to "real" today will fail on a
# missing .onnx file.
#
# CAVEAT ON EVERY DRIFT NUMBER THIS TOOL PRODUCES: the default route is
# synthetic and channel_a/channel_b are dummies fed noised ground-truth
# velocity. Drift figures from this config measure the UKF's math quality
# given near-perfect velocity input. They are NOT system accuracy figures
# and must not be presented as such. No real-data validation exists yet.

route:
  source: synthetic          # synthetic | io_vnbd
  synthetic:
    kind: constant_turn      # straight | constant_turn
    duration_s: 120
    dt_s: 0.1                # 10 Hz, matches Section 7.3's target output rate
    speed_mps: 16.7           # ~60 km/h, matches the HLD's "1km at 60km/h" benchmark example
    turn_rate_dps: 3.0        # only used when kind: constant_turn
    accel_noise_std: 0.05     # m/s^2, additive noise on synthetic accelerometer
    gyro_noise_std: 0.01      # rad/s, additive noise on synthetic gyro
    accel_bias: 0.03          # m/s^2, constant bias - this is what makes raw double-integration blow up
    speed_variation_mps: 0.0  # only used when kind: varying_speed - sinusoid amplitude around speed_mps
    speed_period_s: 40.0      # only used when kind: varying_speed - sinusoid period
    seed: 0
  io_vnbd:
    processed_path: null      # e.g. data/processed/benchmark_replay/route_001.npz - fill in once Layer 1 delivers

# Blackout window per MIP Section 9 step 2: GNSS is masked only inside
# this window, still feeds the fusion core normally outside it.
blackout:
  start_s: 40
  end_s: 100

# Section 2 of the handoff doc: five swappable components.
# Checkpoint progress (⬜ = still dummy in this repo, no exception):
#   ✅ fusion: real          (Checkpoint 1 - ukf.py)
#   ⬜ channel_a: real       blocked - trained model rejected at gate, no ONNX
#   ⬜ channel_b: real       blocked - never trained, no label function
#   ⬜ road_signature: real  blocked - needs labeling + training
#   ⬜ map_matching: real    blocked - needs OSM extraction + Viterbi
#
# To run with real models (once an export actually exists):
#   1. Set channel_a: real and/or channel_b: real
#   2. Fill in the channel_a and channel_b sections below with correct paths
#   3. Update the r_channel_a / r_channel_b overrides to the measured RMSE
components:
  channel_a: dummy          # none | dummy | physics | real
  channel_b: dummy          # none | dummy | real
  road_signature: dummy     # dummy | real  (real needs road_signature model, Phase 5)
  fusion: real              # dummy | real  (real = fusion_core/python_prototype/ukf.py)
  map_matching: dummy       # dummy | real  (real = HMM/Viterbi, Phase 5)

# What each channel switch means:
#   none     - this channel contributes nothing, ever. `channel_a: none` plus
#              `channel_b: none` is the honest "what the phone does today"
#              baseline: no trained velocity model exists, so the UKF coasts on
#              its CTCV process model through a blackout. Report every other
#              number against this one.
#   dummy    - noised ground-truth velocity. Better information than any real
#              system will ever have. Useful for isolating the UKF's own math
#              quality; useless as a system accuracy figure.
#   physics  - Channel P, fusion_core/python_prototype/physics_speed.py. A
#              classical integrate-accel-and-reseed-from-GNSS estimator, no ML,
#              no training, no dataset. Occupies Channel A's update slot without
#              being Channel A.
#   real     - the trained ONNX model. Does not exist for either channel.

# --- Channel P (physics forward-speed estimator) --------------------------
# Used when components.channel_a is 'physics'.
# r_mps is MEASURED, not targeted: run
#   python -m tools.measure_physics_channel_r --kind varying_speed
# and use the RMSE it reports. Do not copy r_channel_a's 0.5 here - that is
# MIP Section 4.2's target for a trained model and has never been met.
channel_p:
  r_mps: 1.13              # measured blackout-window RMSE on the varying_speed route
  max_speed_mps: 70.0
  leak_tau_s: 0.0          # 0 disables the leak toward last GNSS speed
  gnss_speed_noise_std: 0.3  # matches FusionConfig.r_gnss_vel
  seed: 3

# --- Real component configuration (used when above switches are 'real') ---
# Channel A ONNX velocity estimator (MIP Section 4.2, Phase 2)
channel_a:
  onnx_path: models/channel_a_velocity/exported/channel_a.onnx
  norm_stats_path: data/processed/channel_a_velocity/norm_stats.json
  window_len: 200          # 2s @ 100Hz — update if trained with larger window (Phase 2.2 ablation)
  n_imu_channels: 6        # accel xyz + gyro xyz
  delta_v_mode: false      # set to true if model was trained with --delta-v (Phase 2.1)

# Channel B ONNX velocity estimator (MIP Section 4.3, Phase 3)
channel_b:
  onnx_path: models/channel_b_velocity/exported/channel_b.onnx
  norm_stats_path: data/processed/channel_b_velocity/norm_stats.json
  window_len: 400          # 4s @ 100Hz
  n_imu_channels: 3        # accel xyz only (no gyro - independence contract)
  delta_v_mode: false      # Channel B always absolute velocity

# HMM map matcher (MIP Section 6, Phase 5)
map_matching:
  graph_path: map_matching/osm_extraction/corridor.graphml  # generated by extract.py
  window_size: 15          # Viterbi sliding window size (commits with W-step delay)
  sigma_emit_m: 10.0       # Gaussian emission noise std (meters)
  beta_transition: 10.0    # Transition decay constant (meters); larger = looser

# Section 4 of the handoff doc - road-signature confidence threshold,
# matches MIP Section 5.3.
road_signature_confidence_threshold: 0.85

# --- UKF FusionConfig overrides (when fusion: real) ---
# IMPORTANT (Phase 4.4): these R values must match the ACTUAL measured RMSE
# from the trained models, not the MIP's aspirational targets.
# Update after Phase 2 (Channel A) and Phase 3 (Channel B) training completes.
# Using wrong R values makes the UKF trust channels it shouldn't.
#
# The UKF's FusionConfig defaults are:
#   r_channel_a: 0.5 m/s  (MIP aspirational; overestimated trust)
#   r_channel_b: 1.75 m/s (MIP aspirational; overestimated trust)
# After training, override these in ukf.py's FusionConfig with actual values.
# Reminder: r_channel_a should be your test RMSE; r_channel_b = your test RMSE.

output:
  plot_path: tools/benchmark_replay/output/latest_run.png
  regression_log_path: tools/benchmark_replay/output/regression_log.csv

# --- ZUPT (zero-velocity update) ------------------------------------------
# Standard land-vehicle INS: when the IMU says the vehicle is stopped, apply a
# velocity measurement of (0, 0) with a tight R. Free accuracy at traffic
# lights, and it stops Channel P's integrator wandering while stationary.
#
# Gated on raw IMU variance, never on the filter's own speed estimate - see
# fusion_core/python_prototype/zupt.py for why that distinction matters.
#
# Thresholds below are tuned to the SYNTHETIC IMU noise in route.synthetic
# above. A real phone in a real idling vehicle is noisier. Re-measure against a
# recording of the demo vehicle actually stopped before trusting these on
# hardware, or ZUPT will simply never fire.
zupt:
  enabled: false           # see zupt.py - cannot be honestly validated on synthetic IMU
  window_n: 10              # samples (1.0 s at 10 Hz)
  accel_var_threshold: 0.02 # (m/s^2)^2
  gyro_var_threshold: 0.002 # (rad/s)^2
  accel_magnitude_threshold: 0.3  # m/s^2 - the only gate doing real work on synthetic data
  r_mps: 0.05               # tight, but not zero - the detector can be wrong
